# Enable HTTP
quarkus.http.insecure-requests=enabled
# Setup PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/ping
quarkus.transaction-manager.default-transaction-timeout=3000s
quarkus.hibernate-orm.log.queries-slower-than-ms=200
quarkus.hibernate-orm.database.generation=update
# Set port
quarkus.http.port=8080
quarkus.devservices.enabled=true
%test.quarkus.devservices.enabled=false

smallrye.jwt.sign.key.location=privateKey.txt
mp.jwt.verify.publickey.location=publicKey.txt

mp.jwt.verify.issuer=Groupe7
filesystem.default.path=${FILESYSTEM_DEFAULT_PATH:/var/www/projects}
log_file=${LOG_FILE:Log.txt}
error_file=${ERROR_LOG_FILE:ErrorLog.txt}

quarkus.swagger-ui.always-include=true
quarkus.datasource.password=postgres
%test.quarkus.datasource.password=postgres