image: maven:3.9.6-eclipse-temurin-21

cache:
  paths:
    - .m2/repository

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  POSTGRES_DB: ping
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

stages:
  - build

compile-job:
  stage: build
  script:
    - cd ping
    - mvn clean install

